<!--TYPE FORMAT / DEFAULT FORMAT-->
<tr id="%asset_assetid%" data-asset-id="%asset_assetid%">
    <!--@@ No @@-->
    <td>%asset_position%</td>
    <!--@@ Type @@-->
    <td>%asset_type%</td>
    <!--@@ Asset ID @@-->
    <td>
        <a href="./?a=%asset_assetid%/_admin" target="_blank">%asset_assetid%</a>
    </td>
    <!--@@ Status @@-->
    <td class="metadata-editor" style="background-color:%asset_status_colour%;">
        <div class="edit_area" data-editor-field="status" data-label="status">%asset_status_description%</div>
    </td>
    <!--@@ Name @@-->
    <td class="attribute-editor">
        <div class="edit_area" data-editor-field="name" data-attributename="name" data-label="name">%asset_name%</div>
    </td>
    <!--@@ Resource Type @@-->
    <td class="metadata-editor">
        <div class="edit_area" data-editor-field="resource-type" data-metadatafieldid="834003" data-label="resource type">%asset_metadata_resource_doctype%</div>
    </td>
    <!--@@ Resource Description @@-->
    <td class="metadata-editor">
        <div class="edit_area" data-editor-field="resource-description" data-metadatafieldid="834005" data-label="resource description">%asset_metadata_resource.description%</div>
    </td>
    <!--@@ URL @@-->
    <td><a href="%asset_url%" target="_blank">%asset_url%</a></td>
</tr>
